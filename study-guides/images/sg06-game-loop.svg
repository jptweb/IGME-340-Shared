<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The Flame game loop</title>
  <desc>onLoad runs once. Then update(dt) and render repeat about 60 times per second. You write onLoad and update; Flame does render.</desc>
  <defs>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F76902"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C878E"/>
    </marker>
  </defs>
  <rect width="720" height="320" rx="16" fill="#FFFFFF"/>

  <!-- labels over each phase -->
  <text x="105" y="104" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#7C878E">ONCE</text>
  <text x="468" y="34" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#7C878E">EVERY FRAME</text>

  <!-- onLoad -->
  <rect x="30" y="118" width="150" height="64" rx="10" fill="#FFFFFF" stroke="#282828" stroke-width="2"/>
  <text x="105" y="157" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#282828">onLoad()</text>
  <line x1="182" y1="150" x2="232" y2="150" stroke="#7C878E" stroke-width="2.5" marker-end="url(#arrowGray)"/>

  <!-- update -->
  <rect x="240" y="118" width="160" height="64" rx="10" fill="#FFF1E6" stroke="#F76902" stroke-width="2.5"/>
  <text x="320" y="157" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#282828">update(dt)</text>

  <!-- render -->
  <rect x="540" y="118" width="150" height="64" rx="10" fill="#F2F3F3" stroke="#A2AAAD" stroke-width="2"/>
  <text x="615" y="157" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#7C878E">render</text>

  <!-- the loop -->
  <path d="M 320 115 C 370 46, 565 46, 615 113" fill="none" stroke="#F76902" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <path d="M 615 185 C 565 254, 370 254, 320 187" fill="none" stroke="#F76902" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="468" y="157" text-anchor="middle" font-size="30" font-weight="800" fill="#F76902">60×</text>
  <text x="468" y="177" text-anchor="middle" font-size="13" fill="#7C878E">per second</text>

  <!-- what each one is for -->
  <text x="105" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="#282828">set things up</text>
  <text x="105" y="304" text-anchor="middle" font-size="13" fill="#7C878E">you write this</text>
  <text x="320" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="#282828">change the world</text>
  <text x="320" y="304" text-anchor="middle" font-size="13" fill="#7C878E">you write this</text>
  <text x="615" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="#282828">draw the world</text>
  <text x="615" y="304" text-anchor="middle" font-size="13" fill="#7C878E">Flame does this</text>
</svg>
